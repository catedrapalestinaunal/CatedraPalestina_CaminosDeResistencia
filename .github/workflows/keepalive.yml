name: Keep Supabase alive
on:
  schedule:
    - cron: '0 0 */3 * *'
jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/projects?select=count")
          echo "Supabase responded with HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then exit 1; fi

  ping-vercel:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Vercel keep-alive endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://catedrapalestinacaminosderesistencia.com/api/ping")
          echo "Vercel ping responded with HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then exit 1; fi
